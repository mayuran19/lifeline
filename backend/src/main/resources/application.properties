# Application
spring.application.name=lifeline-call-log
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/lifeline_app
spring.datasource.username=lifeline_app
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# JOOQ
spring.jooq.sql-dialect=POSTGRES

# JWT Configuration
jwt.secret=your-256-bit-secret-key-change-this-in-production-min-32-chars
jwt.access-token.expiration=900000
jwt.refresh-token.expiration=604800000

# Cookie Configuration
cookie.domain=localhost
cookie.secure=false
cookie.http-only=true
cookie.same-site=Strict

# Disable Spring Boot's HTML error page forwarding — REST APIs return JSON directly
server.error.whitelabel.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# CORS
cors.allowed-origins=http://localhost:5173

# Logging
logging.level.com.lifelinecalllog=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.jooq=DEBUG
