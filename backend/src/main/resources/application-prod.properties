# Production overrides — all sensitive values come from environment variables

# Database
# Railway PostgreSQL plugin provides PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD automatically
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# JWT
jwt.secret=${JWT_SECRET}

# Cookie — must be secure in production (HTTPS)
cookie.secure=true

# CORS — set APP_URL to your Railway public domain (e.g. https://myapp.railway.app)
# In production frontend is same-origin, this is just a safety net
cors.allowed-origins=${APP_URL:http://localhost:8080}

# Serve React static files from classpath:/static/
spring.web.resources.add-mappings=true
spring.mvc.throw-exception-if-no-handler-found=false

# Reduce log noise in prod
logging.level.com.lifelinecalllog=INFO
logging.level.org.springframework.security=WARN
logging.level.org.jooq=WARN
